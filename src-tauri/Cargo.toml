[package]
name = "lightauth"
version = "0.1.3"
description = "LightAuth - A lightweight desktop authenticator for secure two-factor authentication."
authors = ["Kumix Labs"]
license = "MIT"
repository = "https://github.com/kumixlabs/lightauth"
edition = "2021"

[lib]
name = "lightauth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
data-encoding = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
rqrr = "0.9"
dirs = "6"
url = "2"
urlencoding = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
